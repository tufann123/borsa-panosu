name: Haber ve KAP guncellemesi

on:
  schedule:
    # her 3 saatte bir, her gun
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Haber ve KAP guncelle
        run: python refresh_news.py
      - name: Degisiklik varsa commit+push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlanacak."
          else
            git commit -m "Haber ve KAP guncellemesi (otomatik)"
            git push
          fi
